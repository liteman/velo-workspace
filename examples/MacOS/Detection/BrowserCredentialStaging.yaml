name: Custom.MacOS.Detection.BrowserCredentialStaging
description: |
  Hunts for macOS infostealer staging: browser credential stores and the login
  keychain copied outside their normal locations, plus archives created in temp
  or shared locations around the same time.

  macOS stealers (Atomic/AMOS, Poseidon, Banshee, Cthulhu) rarely inject into the
  browser. They phish the user's password, copy `login.keychain-db` and the
  Chromium/Firefox profile files (`Cookies`, `Login Data`, `Local State`,
  `Web Data`, `key4.db`, `logins.json`) into a temp folder, zip it, and exfil
  for offline decryption. The staging folder is usually deleted afterwards,
  but FSEvents keeps a record of the create/delete.

  Sources:
  - **FSEvents**: historical create/rename/delete records. FSEvents entries
    have no per-event timestamp; the source log file's Mtime/Btime bounds the
    time window. `CorrelatedWindow` is true when the same FSEvents log file
    holds both a credential-file hit and a staging-archive hit — the strongest
    signal this artifact produces. A log file can span minutes to hours, so
    "correlated" means same time window, not same activity: pivot from the
    `CredentialFileOutsideProfile` rows and treat co-windowed archives as
    leads (benign temp zips will share the window).
  - **Filesystem**: current files in staging locations (leftovers that were
    not cleaned up), with optional hashing and upload.

  Requires root and Full Disk Access for the Velociraptor client — without FDA,
  TCC silently hides `.fseventsd` and user-library paths and the hunt returns
  nothing.

  FSEvents parsing is imported from `MacOS.Forensics.FSEvents`.

author: liteman

reference:
  - https://www.crowdstrike.com/blog/using-os-x-fsevents-discover-deleted-malicious-artifact/

type: CLIENT

precondition: SELECT OS FROM info() WHERE OS = 'darwin'

imports:
  - MacOS.Forensics.FSEvents

parameters:
  - name: FSEventsGlobs
    type: csv
    default: |
      Glob
      /System/Volumes/Data/.fseventsd/*
      /.fseventsd/*
  - name: StagingGlobs
    description: Locations scanned for leftover staged files (Filesystem source).
    type: csv
    default: |
      Glob
      /private/tmp/**
      /private/var/tmp/**
      /private/var/folders/*/*/T/**
      /Users/Shared/**
  - name: DateAfter
    type: timestamp
    description: Only process FSEvents logs modified after this time, and only report archives modified after it. Empty = no limit.
  - name: CredentialFileRegex
    type: regex
    description: Basenames of browser credential stores and keychains. Allows a prefix ending in _ or - so renamed copies (e.g. Chrome_Cookies) still match, but not source files like cookies.py.
    default: (?i)^([\w.-]*[_-])?(cookies(\.sqlite)?|login ?data( for account)?|local ?state|web ?data|login\.keychain-db|key4\.db|logins\.json)(-journal|-wal|-shm)?$
  - name: ExpectedPathRegex
    type: regex
    description: Where credential files legitimately live. Matches here are not reported.
    default: ^/?(System/Volumes/Data/)?(Users/[^/]+/Library/(Application Support|Containers|Group Containers|Keychains|Caches|Safari|HTTPStorages|Cookies|WebKit)/|Library/Keychains/|private/var/(db|root)/|System/|Volumes/com\.apple\.TimeMachine)
  - name: StagingPathRegex
    type: regex
    description: Temp and shared locations stealers stage archives in (FSEvents source).
    default: ^/?(System/Volumes/Data/)?((private/)?(tmp|var/tmp|var/folders/[^/]+/[^/]+/T)/|Users/Shared/|Users/[^/]+/\.[^/]+/)
  - name: ArchiveRegex
    type: regex
    default: (?i)\.(zip|7z|rar|tar|tgz|gz)$
  - name: FSEventsMaxBytes
    type: int
    description: Max decompressed bytes read per FSEvents log.
    default: 1000000
  - name: HashFiles
    type: bool
    default: Y
  - name: UploadFiles
    description: Upload leftover staged files. These contain live session cookies — handle the collection as sensitive.
    type: bool
    default: N

sources:
  - name: FSEvents
    query: |
      LET fse_logs = SELECT OSPath,
                            Mtime,
                            Btime
        FROM glob(globs=FSEventsGlobs.Glob)
        WHERE NOT IsDir
         AND if(condition=DateAfter, then=Mtime > DateAfter, else=TRUE)
      
      LET raw = SELECT *
        FROM foreach(row=fse_logs,
                     query={
          SELECT Info.Items AS items,
                 OSPath.Basename AS SourceFile,
                 Mtime AS SourceMtime,
                 Btime AS SourceBtime
          FROM foreach(row=parse_binary(filename=read_file(
                                          filename=OSPath,
                                          accessor="gzip",
                                          length=FSEventsMaxBytes),
                                        accessor="data",
                                        profile=FSEventProfile,
                                        struct="FSEventsProfile").Entries)
        })
      
      LET entries = SELECT items.path AS EntryPath,
                           join(array=items.flags, sep=", ") AS EntryFlags,
                           SourceFile,
                           SourceMtime,
                           SourceBtime
        FROM flatten(query=raw)
      
      LET hits <= SELECT if(condition=basename(path=EntryPath) =~
                              CredentialFileRegex
                             AND NOT EntryPath =~ ExpectedPathRegex,
                            then="CredentialFileOutsideProfile",
                            else=if(
                              condition=EntryPath =~ StagingPathRegex
                               AND EntryPath =~ ArchiveRegex
                                    AND EntryFlags =~ "FSE_CREATE_FILE|FSE_RENAME",
                              then="StagingArchive")) AS Finding,
                         EntryPath,
                         parse_string_with_regex(regex="Users/(?P<User>[^/]+)",
                                                 string=EntryPath).User AS User,
                         EntryFlags,
                         EntryFlags =~ "FSE_DELETE" AS Deleted,
                         SourceFile,
                         SourceMtime,
                         SourceBtime
        FROM entries
        WHERE Finding
         AND NOT EntryFlags =~ "IsDirectory"
      
      LET cred_windows <= SELECT SourceFile
        FROM hits
        WHERE Finding = "CredentialFileOutsideProfile"
        GROUP BY SourceFile
      
      LET archive_windows <= SELECT SourceFile
        FROM hits
        WHERE Finding = "StagingArchive"
        GROUP BY SourceFile
      
      SELECT *, SourceFile IN cred_windows.SourceFile
              AND SourceFile IN archive_windows.SourceFile AS CorrelatedWindow
      FROM hits

  - name: Filesystem
    query: |
      LET staged = SELECT OSPath,
                          Name,
                          Size,
                          Mtime,
                          Btime,
                          Mode.String AS Mode,
                          if(condition=Name =~ CredentialFileRegex,
                             then="CredentialFileOutsideProfile",
                             else="StagingArchive") AS Finding
        FROM glob(globs=StagingGlobs.Glob)
        WHERE NOT IsDir
         AND (Name =~ CredentialFileRegex OR (Name =~ ArchiveRegex
                  AND if(condition=DateAfter, then=Mtime > DateAfter, else=TRUE)))
      
      SELECT Finding,
             OSPath,
             Size,
             Mtime,
             Btime,
             Mode,
             if(condition=HashFiles, then=hash(path=OSPath)) AS Hash,
             if(condition=UploadFiles, then=upload(file=OSPath)) AS Upload
      FROM staged